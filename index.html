<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cafe E-Commerce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 🔥 NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="#">☕ Cafe Brew</a>

        <div class="ms-auto">
            <input class="form-control" placeholder="Search coffee, snacks..." />
        </div>
    </nav>

    <!-- 🔥 CAROUSEL -->
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" class="d-block w-100 hero-img">
            </div>

            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1521302080334-4bebac2763a6" class="d-block w-100 hero-img">
            </div>

        </div>

    </div>

    <!-- 🔥 MAIN LAYOUT -->
    <div class="container-fluid mt-3">
        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-md-3 sidebar">

                <h5 class="p-3">Categories</h5>

                <ul class="list-unstyled">

                    <li onclick="showAll()">🏠 All Items</li>

                    <!-- Coffee -->
                    <li onclick="toggle('coffeeMenu')">☕ Coffee ▼</li>
                    <ul id="coffeeMenu" class="submenu">
                        <li onclick="filter('espresso')">Espresso</li>
                        <li onclick="filter('latte')">Latte</li>
                    </ul>

                    <!-- Snacks -->
                    <li onclick="toggle('snackMenu')">🍔 Snacks ▼</li>
                    <ul id="snackMenu" class="submenu">
                        <li onclick="filter('burger')">Burger</li>
                        <li onclick="filter('sandwich')">Sandwich</li>
                    </ul>

                    <!-- Desserts -->
                    <li onclick="toggle('dessertMenu')">🍰 Desserts ▼</li>
                    <ul id="dessertMenu" class="submenu">
                        <li onclick="filter('cake')">Cake</li>
                        <li onclick="filter('donut')">Donut</li>
                    </ul>

                </ul>

            </div>

            <!-- PRODUCTS -->
            <div class="col-md-9">
                <div class="row p-3" id="productContainer"></div>
            </div>

        </div>
    </div>

    <!-- 🔥 FOOTER -->
    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p>☕ Cafe Brew © 2026 | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
